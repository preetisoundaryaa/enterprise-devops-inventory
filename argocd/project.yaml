apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: enterprise-devops-inventory
  namespace: argocd
spec:
  description: GitOps project for Enterprise DevOps Inventory Platform
  sourceRepos:
    - https://github.com/your-org/enterprise-devops-inventory.git
  destinations:
    - namespace: inventory
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
