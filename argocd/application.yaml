apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-devops-inventory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/enterprise-devops-inventory.git
    targetRevision: HEAD
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: inventory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
