apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-devops-inventory
  namespace: argocd
spec:
  project: enterprise-devops-inventory
  source:
    repoURL: https://github.com/your-org/enterprise-devops-inventory.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: inventory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
